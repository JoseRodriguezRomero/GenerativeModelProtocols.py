name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out Python bindings
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Install Python package and dependencies
        run: python -m pip install .
        shell: bash

      - name: Clone Julia package
        run: git clone --depth 1 --branch main https://github.com/JoseRodriguezRomero/GenerativeModelProtocols.jl.git GenerativeModelProtocols.jl
        shell: bash

      - name: Install Julia package and dependencies
        shell: bash
        run: |
          julia --color=yes -e '
            using Pkg

            Pkg.Registry.add("General")

            # Resolve the Julia package in its own environment first.
            cd("GenerativeModelProtocols.jl")
            isfile("Manifest.toml") && rm("Manifest.toml")
            Pkg.activate(".")
            Pkg.resolve()
            Pkg.instantiate()

            # Install the resolved local package into the Python CI environment.
            cd("..")
            Pkg.activate("ci-env")
            Pkg.develop(path="GenerativeModelProtocols.jl")

            Pkg.add([
              "Reactant",
              "FileIO",
              "HDF5",
              "Distances",
              "OptimalTransport",
              "Tulip"
            ])

            Pkg.precompile()
          '

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "tests.py" -v
        shell: bash