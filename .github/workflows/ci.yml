name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out Python bindings
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Install Python package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "juliapkg>=0.1.10" juliacall coverage
          python -m pip install .
        shell: bash

      - name: Clone Julia package
        run: git clone --depth 1 --branch main https://github.com/JoseRodriguezRomero/GenerativeModelProtocols.jl
        shell: bash

      - name: Resolve Julia package manifest
        shell: julia --color=yes {0}
        run: |
          using Pkg

          Pkg.Registry.add("General")

          project_dir = joinpath(pwd(), "GenerativeModelProtocols.jl")
          manifest_path = joinpath(project_dir, "Manifest.toml")

          if isfile(manifest_path)
              rm(manifest_path)
          end

          Pkg.activate(project_dir)
          Pkg.resolve()
          Pkg.instantiate()

      - name: Install Julia package and dependencies
        shell: julia --color=yes {0}
        run: |
          using Pkg

          Pkg.autoprecompilation_enabled(false)
          Pkg.Registry.add("General")
          Pkg.activate("ci-env")

          Pkg.develop(path="GenerativeModelProtocols.jl")

          Pkg.add([
              "Reactant",
              "FileIO",
              "HDF5",
              "Distances",
              "OptimalTransport",
              "Tulip",
              "Lux",
              "Optimisers",
              "PythonCall"
          ])

          Pkg.instantiate()

      - name: Run Python tests with Coverage
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          PYTHON_JULIACALL_EXE: "julia"
          PYTHON_JULIACALL_PROJECT: "${{ github.workspace }}/ci-env"
          PYTHON_JULIAPKG_OFFLINE: "yes"
          JULIA_PROJECT: "${{ github.workspace }}/ci-env"
        run: |
          unset LD_PRELOAD
          export LD_LIBRARY_PATH="$(julia -e 'using OpenSSL_jll; print(dirname(OpenSSL_jll.libssl_path))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PYTHON_JULIACALL_HANDLE_SIGNALS=yes python -m coverage run --source=GenerativeModelProtocols test/tests.py -v -s
          python -m coverage xml
        shell: bash

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
