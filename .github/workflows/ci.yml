name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out Python bindings
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Install Python package and dependencies
        run: python -m pip install .
        shell: bash

      - name: Clone Julia package
        run: git clone --depth 1 --branch main https://github.com/JoseRodriguezRomero/GenerativeModelProtocols.jl.git GenerativeModelProtocols.jl
        shell: bash

      - name: Install Julia package and dependencies
        shell: bash
        run: |
          julia --project=ci-env -e '
            using Pkg

            Pkg.Registry.add("General")
            Pkg.develop(path="GenerativeModelProtocols.jl")

            Pkg.add("SpecialFunctions")
            Pkg.add([
              "Reactant",
              "FileIO",
              "HDF5",
              "Distances",
              "OptimalTransport",
              "Tulip"
            ])

            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "tests.py" -v
        shell: bash