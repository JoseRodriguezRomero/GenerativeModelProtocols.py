[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GenerativeModelProtocols"
version = "0.1.0"
authors = [
  { name = "Jose Romero", email = "jrodriguesro@umass.edu" },
]
description = "A unified Python framework for building, training, and deploying generative models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "juliacall",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "myst-parser>=2",
    "sphinx-rtd-theme>=2",
    "sphinxcontrib-bibtex>=2.6",
]

[project.urls]
Homepage = "https://github.com"
Issues = "https://github.com/issues"
